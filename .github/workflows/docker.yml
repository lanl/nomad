name: Docker
on:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  demo-image:
    name: Demo Image
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Free Disk Space (Ubuntu)
        if: ${{ !env.ACT }}
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build demo image
        id: build
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            image="ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}"
            platforms="linux/amd64,linux/arm64"
            output="--push"
          else
            image="nomad-demo:ci"
            platforms="linux/amd64"
            output="--load"
          fi
          cache=()
          if [[ "${ACT:-}" != "true" ]]; then
            cache=(
              --cache-from type=gha,scope=demo-image
              --cache-to type=gha,scope=demo-image,mode=max
            )
          fi
          docker buildx build \
            --tag "${image}" \
            --platform "${platforms}" \
            "${cache[@]}" \
            --file container/demo/Dockerfile \
            "${output}" \
            .
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
      - name: Smoke test demo image
        run: >
          uv run container/demo/smoke.py image
          --host 127.0.0.1
          --image "${{ steps.build.outputs.image }}"
      - name: Smoke test observability stack
        run: >
          uv run container/demo/smoke.py observability
          --host 127.0.0.1
          --image "${{ steps.build.outputs.image }}"
      - name: Resolve image digest
        id: digest
        if: github.event_name == 'release'
        run: |
          digest="$(docker buildx imagetools inspect \
            "${{ steps.build.outputs.image }}" \
            | awk '/^Digest:/ {print $2; exit}')"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Attest image provenance
        if: github.event_name == 'release'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
