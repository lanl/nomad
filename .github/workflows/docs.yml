name: Docs
on:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  UV_FROZEN: "1"
  UV_LINK_MODE: symlink
  UV_PYTHON: 3.12.12
  UV_TORCH_BACKEND: cpu
jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: docs
      - uses: actions/cache@v6
        with:
          path: ~/.cache/nomad
          key: nomad-cache-${{ hashFiles('./container/*/nomad.yml', './container/*/uv.lock') }}
          restore-keys: nomad-cache-
      - name: Install Tectonic
        uses: wtfjoke/setup-tectonic@eb29fd68b7d3f76011906b6e45ea4320c8de5d2f
        with:
          tectonic-version: 0.17.0
      - name: Cache Tectonic resources
        uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-0.17.0
      - name: Build docs
        run: uv run --group dev --group docs just docs
      - name: Build docs PDF
        run: uv run --no-dev --group docs just docs-pdf
      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html
          if-no-files-found: error
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-pdf
          path: docs/_build/latex/nomad-scifm.pdf
          if-no-files-found: error
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html
  deploy:
    name: Publish Docs
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
  upload-release:
    name: Upload PDF to GitHub Release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download PDF
        uses: actions/download-artifact@v8
        with:
          name: docs-pdf
          path: release-assets
      - name: Upload PDF
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/nomad-scifm.pdf
          fail_on_unmatched_files: true
